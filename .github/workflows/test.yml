name: Test

# Run the unit tests on every push and pull request, on the oldest supported Python
# and on the latest Python for each OS bwenv supports.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.7 is the documented minimum; ubuntu-22.04 is the newest runner that still installs it.
          - os: ubuntu-22.04
            python-version: "3.7"
          - os: ubuntu-latest
            python-version: "3.x"
          - os: macos-latest
            python-version: "3.x"
          - os: windows-latest
            python-version: "3.x"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest test_bwenv -v
